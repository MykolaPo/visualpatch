<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font-family: Inter, system-ui, sans-serif;
        background: #14171f;
        color: #eef1f7;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      p {
        margin: 0 0 12px;
        font-size: 12px;
        color: #98a2b3;
      }
      button {
        width: 100%;
        height: 34px;
        border: none;
        border-radius: 6px;
        background: #6366f1;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      #status {
        margin-top: 10px;
        font-size: 11px;
        color: #98a2b3;
      }
    </style>
  </head>
  <body>
    <h1>VisualPatch Capture</h1>
    <p>Захватит видимую область страницы и DOM-селекторы (включая Shadow DOM и доступные iframe).</p>
    <button id="captureBtn">Экспортировать проект (.json)</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
